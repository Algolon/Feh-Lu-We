<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>GRASS-R01 · Isolated vegetation calibration</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#c4dce5; font: 13px/1.5 system-ui,sans-serif; }
    #viewport {position:fixed;inset:0}
    #viewport canvas {display:block}
    #overlay { position:fixed; top:12px;left:12px;max-width:min(530px,calc(100vw - 24px));
      padding:14px 17px; background:#101d1adf; color:#eaf0e7; border-radius:11px;
      box-shadow:0 4px 24px #0004; }
    #overlay h1 {margin:0;font-size:15px;letter-spacing:.08em;}
    #overlay p {margin:7px 0;}
    #overlay small {display:block;opacity:.8;}
    .switches {display:flex;flex-wrap:wrap;gap:8px;margin:9px 0}
    label {display:flex;align-items:center;gap:5px}
    select {font:inherit;padding:4px 7px;border:1px solid #8ea89b;border-radius:6px;background:#fcfff6;color:#1c2a20}
    #metrics {font-variant-numeric:tabular-nums}
    @media(max-width:540px) { #overlay{padding:9px 11px;font-size:11px;}#overlay h1{font-size:12px} }
  </style>
</head>
<body>
  <div id="viewport" aria-label="Three.js grass model comparison"></div>
  <aside id="overlay" aria-label="Calibration parameters and performance"></aside>
  <script type="module" src="/src/reviews/grassR01Calibration.ts"></script>
</body>
</html>
