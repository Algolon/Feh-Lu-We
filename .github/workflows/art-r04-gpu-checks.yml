name: ART-R04 GPU texture regression QA
on:
  push:
    branches: [fix/art-r04-gpu-texture-reallocation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: art-r04-gpu-checks
  cancel-in-progress: true
jobs:
  gpu-texture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Assert full and compact GPU texture reallocation
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4188 > /tmp/art-r04-preview.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4188/Feh-Lu-We/ > /dev/null && break
            sleep 1
          done
          node scripts/art-gpu-reallocation-qa.mjs http://127.0.0.1:4188/Feh-Lu-We/
