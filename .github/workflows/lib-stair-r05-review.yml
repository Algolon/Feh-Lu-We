name: LIB-STAIR-R05 reference stair rail and upper landing QA
on:
  push:
    branches: [lib-stair-r05-reference-rail-simplification]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/lib-stair-r05-review.mjs'
      - '.github/workflows/lib-stair-r05-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lib-stair-r05-review
  cancel-in-progress: true
jobs:
  stair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Render game and test gallery floor, closed newel rail and path
        run: node scripts/lib-stair-r05-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lib-stair-r05-game-review
          path: docs/lib-stair-r05/review
          if-no-files-found: warn
      - name: Save candidate screenshots to review branch
        if: always()
        shell: bash
        run: |
          if [ ! -d docs/lib-stair-r05/review ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lib-stair-r05/review
          if ! git diff --cached --quiet; then
            git commit -m "docs(lib-stair-r05): record in-game gallery railing and floor evidence"
            git push origin HEAD:lib-stair-r05-reference-rail-simplification
          fi
