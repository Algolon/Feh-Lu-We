# Build, test and deploy Feh Lu We to GitHub Pages.
# Pages must be enabled once in Settings → Pages → "Build and deployment" → Source: GitHub Actions.
# Every push runs typecheck + unit tests + production build; only the repository's default branch deploys.
# Action versions verified against the official actions/* repositories (tags + action.yml), Oct 2026.
name: Build and deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # TEMPORARY DEV-02 estate review: a manual run of claude/wizardly-curie-y9xumd builds exactly commit e87e56b
          # (game code and build label); every other run checks out its own ref as before.
          ref: ${{ (github.event_name == 'workflow_dispatch' && github.ref_name == 'claude/wizardly-curie-y9xumd') && 'e87e56b350a43759e26f4d1f8985dec497e6e090' || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # TEMPORARY DEV-02 estate review: prove the deployed root is the normal game (no review=dev01 entry guard)
      - if: github.event_name == 'workflow_dispatch' && github.ref_name == 'claude/wizardly-curie-y9xumd'
        run: |
          git rev-parse HEAD
          if grep -E "review=dev01|playtest entry guard" dist/index.html; then echo "entry guard found"; exit 1; fi
          sha256sum dist/index.html dist/assets/*
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # TEMPORARY DEV-02 estate review: also deploy a manual (workflow_dispatch) run of claude/wizardly-curie-y9xumd; pushes to it never deploy
    if: github.ref_name == github.event.repository.default_branch || (github.event_name == 'workflow_dispatch' && github.ref_name == 'claude/wizardly-curie-y9xumd')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
