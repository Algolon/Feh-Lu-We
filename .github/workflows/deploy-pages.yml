# Build, test and deploy Feh Lu We to GitHub Pages.
# Pages must be enabled once in Settings → Pages → "Build and deployment" → Source: GitHub Actions.
# Every push runs typecheck + unit tests + production build; only the repository's default branch deploys.
# Action versions verified against the official actions/* repositories (tags + action.yml), Oct 2026.
name: Build and deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Guard the actual image pixels before publishing. Unit tests alone cannot catch a 4px placeholder.
      # Force a failed initial WebP request: the atlas loader must self-heal and keep batching enabled.
      - name: Painting atlas WebGL release gate
        if: github.ref_name == github.event.repository.default_branch
        shell: bash
        run: |
          npx playwright-core install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4188 > /tmp/flw-paint-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            curl -sf http://127.0.0.1:4188/Feh-Lu-We/ > /dev/null && break
            sleep 1
          done
          ART_PROBE_ASSERT=1 ART_PROBE_INJECT_FIRST=1 ART_PROBE_OUT=art-probe node scripts/art-painting-regression-probe.mjs http://127.0.0.1:4188/Feh-Lu-We/
          # Regression: the 4px fallback has been uploaded to WebGL before the real atlas arrives.
          # A completely new texture object is required to allocate correctly sized storage.
          node scripts/art-gpu-reallocation-qa.mjs http://127.0.0.1:4188/Feh-Lu-We/
          # Independent family route: no bong action, no audio request, separate save and working handpan.
          node scripts/family-edition-smoke.mjs http://127.0.0.1:4188/Feh-Lu-We/
      - uses: actions/upload-artifact@v4
        if: always() && github.ref_name == github.event.repository.default_branch
        with:
          name: painting-atlas-release-evidence
          path: art-probe
          if-no-files-found: warn
      # LIGHT-R06D: build and append a *separate* browser-playable review route.
      # DO NOT merge or publish PR #115 itself. Its reviewed lighting stays in
      # a pinned source snapshot; normal '/' and '/game/' retain production code.
      # Explicitly run this on feature branches too to validate before release.
      - name: Checkout pinned LIGHT-R06D review source
        uses: actions/checkout@v7
        with:
          ref: 1a2fba2ff9ab88880e796a5559d71081a6091ecc
          path: r06d-preview-source
          persist-credentials: false
      - name: Build isolated LIGHT-R06D URL without altering main game
        shell: bash
        run: |
          set -euo pipefail
          cd r06d-preview-source
          npm ci
          npm run typecheck
          npm run build -- --base /Feh-Lu-We/light-r06d/
          cd ..
          mkdir -p dist/light-r06d
          cp -a r06d-preview-source/dist/. dist/light-r06d/
          cp r06d-preview-source/scripts/light-r06d-device-probe.js dist/light-r06d/light-r06d-device-probe.js
          python3 - <<'PY'
          from pathlib import Path
          f=Path('dist/light-r06d/index.html')
          html=f.read_text()
          assert '</body>' in html, 'review index missing body'
          assert '/Feh-Lu-We/light-r06d/assets/' in html, 'review asset base not nested'
          tag='<script defer src="/Feh-Lu-We/light-r06d/light-r06d-device-probe.js"></script>'
          f.write_text(html.replace('</body>',tag+'</body>'))
          PY
          test -f dist/index.html
          test -f dist/game/index.html
          test -f dist/light-r06d/index.html
          test -f dist/light-r06d/light-r06d-device-probe.js
      # LIGHT-R08 is a separate opted-in review, preserving both production
      # and the approved /light-r06d/ route. Do not merge PR #118 itself.
      - name: Checkout LIGHT-R08 source on current production baseline
        uses: actions/checkout@v7
        with:
          # Verified library desk task-light fix + scoped painted desk surfaces.
          ref: a1e87494c89d91adc63f439ae0e03c78363b5dae
          path: r08-preview-source
          persist-credentials: false
      - name: Build isolated LIGHT-R08 browser route and device recorder
        shell: bash
        run: |
          set -euo pipefail
          cd r08-preview-source
          # Release must include the reviewed local banker's-lamp fix:
          # a bounded desk-only contribution and scoped author-paint materials.
          grep -Fq 'task=2.0*tabletop*downward;' src/world/stableLighting.ts
          grep -Fq "chunk==='mLib' && profile==='paint'" src/world/stableLighting.ts
          npm ci
          npm run typecheck
          npm test
          npm run build -- --base /Feh-Lu-We/light-r08/
          cd ..
          mkdir -p dist/light-r08
          cp -a r08-preview-source/dist/. dist/light-r08/
          cp r08-preview-source/scripts/light-r08-device-probe.js dist/light-r08/light-r08-device-probe.js
          python3 - <<'PY'
          from pathlib import Path
          f=Path('dist/light-r08/index.html')
          html=f.read_text()
          assert '</body>' in html,'R08 nested index is incomplete'
          assert '/Feh-Lu-We/light-r08/assets/' in html,'R08 asset URLs not path-scoped'
          snippet='<script defer src="/Feh-Lu-We/light-r08/light-r08-device-probe.js"></script>'
          f.write_text(html.replace('</body>',snippet+'</body>'))
          PY
          test -f dist/index.html
          test -f dist/game/index.html
          test -f dist/light-r06d/index.html
          test -f dist/light-r08/index.html
          test -f dist/light-r08/light-r08-device-probe.js
      - name: Smoke test both main and LIGHT-R06D URLs, asset base and saves
        shell: bash
        run: |
          set -euo pipefail
          npx playwright-core install --with-deps chromium
          if ! curl -sf http://127.0.0.1:4188/Feh-Lu-We/ >/dev/null; then
            npm run preview -- --host 127.0.0.1 --port 4188 >/tmp/flw-pages-preview.log 2>&1 &
          fi
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4188/Feh-Lu-We/light-r06d/ >/dev/null && break
            sleep 1
          done
          node scripts/light-r06d-pages-smoke.mjs http://127.0.0.1:4188/Feh-Lu-We/
      - name: LIGHT-R08 separate route real browser/save/fixture regression
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4188/Feh-Lu-We/light-r08/ >/dev/null && break
            sleep 1
          done
          node scripts/light-r08-pages-smoke.mjs http://127.0.0.1:4188/Feh-Lu-We/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
