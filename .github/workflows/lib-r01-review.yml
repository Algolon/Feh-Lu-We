name: LIB-R01 playable library screenshot review (no deploy)
on:
  push:
    branches: [lib-r01-library-redesign]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/lib-r01-review.mjs'
      - '.github/workflows/lib-r01-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lib-r01-candidate-review
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Render actual library and test staircase traversal (SwiftShader)
        run: node scripts/lib-r01-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lib-r01-actual-in-game-screenshots
          path: docs/lib-r01/review
          if-no-files-found: warn
      - name: Preserve QA evidence on candidate branch only, even if script reports failure
        if: always()
        shell: bash
        run: |
          if [ ! -d docs/lib-r01/review ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lib-r01/review
          if ! git diff --cached --quiet; then
            git commit -m "docs(lib-r01): archive actual in-game screenshots and QA findings"
            git push origin HEAD:lib-r01-library-redesign
          fi
