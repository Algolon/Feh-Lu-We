name: LIGHT-R02 threshold visual checks
on:
  push:
    branches: [lighting/light-r02-threshold-continuity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-r02-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Paired mobile-budget lighting render
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4188 > /tmp/light-r02-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:4188/Feh-Lu-We/ >/dev/null && break; sleep 1; done
          node scripts/light-r02-threshold-qa.mjs http://127.0.0.1:4188/Feh-Lu-We/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: light-r02-threshold-pairs
          path: light-r02-qa
