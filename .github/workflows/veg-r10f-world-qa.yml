name: VEG-R10F in-game ivy scene QA
on:
  push:
    branches:
      - diagnostics/veg-r10f-ivy-world-qa
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright-core install --with-deps chromium
      - name: Inspect live estate ivy materials, positions and mobile views
        run: node scripts/veg-r10f-world-qa.mjs
        env:
          VEG_R10F_PRINT_EVIDENCE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veg-r10f-estate-qa
          path: docs/veg-r10f/review/
          if-no-files-found: warn
