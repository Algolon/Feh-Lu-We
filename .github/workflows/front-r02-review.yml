name: FRONT-R04 in-game door review
on:
  push:
    branches:
      - front-r02-brass-slim-sculpted-lion
    paths:
      - src/world/exteriorDetail.ts
      - src/world/lionKnocker.ts
      - src/world/lionSculptData.ts
      - scripts/generate-lion-sculpt.mjs
      - src/world/arch.ts
      - src/world/manor.ts
      - tests/front-r02.test.ts
      - tests/exterior-detail.test.ts
      - scripts/front-r02-review.mjs
      - .github/workflows/front-r02-review.yml
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Capture running in-game front door (software WebGL)
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/front-r02-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/Feh-Lu-We/ >/dev/null; then break; fi
            sleep 2
          done
          if command -v google-chrome >/dev/null; then
            export CHROME="$(command -v google-chrome)"
          elif command -v chromium >/dev/null; then
            export CHROME="$(command -v chromium)"
          else
            npx playwright-core install chromium
          fi
          node scripts/front-r02-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front-r04-in-game-screenshots
          path: docs/development/workstreams/front-r04/review
          if-no-files-found: warn
      - name: Save screenshots on review branch only
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/workstreams/front-r04/review/
          if ! git diff --cached --quiet; then
            git commit -m "docs(front-r02): capture in-game exterior/interior door review"
            git pull --rebase origin front-r02-brass-slim-sculpted-lion
            git push origin HEAD:front-r02-brass-slim-sculpted-lion
          fi
