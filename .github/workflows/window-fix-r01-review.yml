name: WINDOW-FIX R01 overlap screenshots (no deploy)
on:
  push:
    branches: [fix-window-trim-and-ceiling-overlaps-r01]
    paths: ['src/**', 'scripts/window-overlap-r01-review.mjs', '.github/workflows/window-fix-r01-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/window-overlap-r01-review.mjs
      - run: node scripts/window-r02-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-fix-r01-screenshots
          path: |
            docs/development/workstreams/window-fix-r01/review/
            docs/development/workstreams/window-r02/review/
          if-no-files-found: warn
