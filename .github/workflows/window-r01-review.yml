name: WINDOW-R01 pilot screenshots (no deploy)
on:
  push:
    branches:
      - window-r01-billiard-glazing-pilot
    paths:
      - 'src/**'
      - 'scripts/window-r01-review.mjs'
      - '.github/workflows/window-r01-review.yml'
# Keep concurrent source pushes from publishing out-of-date captures over newer code.
concurrency:
  group: window-r01-review
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/window-r01-review.mjs
      - name: Capture matched pre-pilot baseline
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 76f410a31cc80e2617267bd3693e52aa9f55ae96
          git worktree add --detach /tmp/window-r01-baseline 76f410a31cc80e2617267bd3693e52aa9f55ae96
          cp scripts/window-r01-review.mjs /tmp/window-r01-baseline/scripts/window-r01-review.mjs
          (
            cd /tmp/window-r01-baseline
            npm ci
            WINDOW_R01_BASELINE=1 node scripts/window-r01-review.mjs
          )
          mkdir -p docs/development/workstreams/window-r01/review/baseline
          cp /tmp/window-r01-baseline/docs/development/workstreams/window-r01/review/baseline/* docs/development/workstreams/window-r01/review/baseline/
      - name: Compare matched camera submissions
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const dir='docs/development/workstreams/window-r01/review';
          const before=JSON.parse(readFileSync(dir+'/baseline/results.json','utf8'));
          const after=JSON.parse(readFileSync(dir+'/results.json','utf8'));
          const rows=after.frames.map((v,i)=>({
            quality:v.quality,side:v.side,door:v.door,
            callsBefore:before.frames[i].calls,callsAfter:v.calls,
            callsDelta:v.calls-before.frames[i].calls,
            trianglesBefore:before.frames[i].triangles,trianglesAfter:v.triangles,
            trianglesDelta:v.triangles-before.frames[i].triangles,
          }));
          writeFileSync(dir+'/comparison.json',JSON.stringify({rows,baselineSha:'76f410a31cc80e2617267bd3693e52aa9f55ae96',note:'SwiftShader only, camera counts on low; high includes shadows.'},null,2));
          console.log(JSON.stringify(rows,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-r01-review-evidence
          path: docs/development/workstreams/window-r01/review
          if-no-files-found: warn
      - name: Preserve screenshots on latest pilot branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # The runner's source commit may have aged while software rendering ran.
          # Publish generated evidence on a separate worktree based on CURRENT remote HEAD.
          mkdir -p /tmp/window-r01-evidence
          cp -a docs/development/workstreams/window-r01/review/. /tmp/window-r01-evidence/
          git fetch origin window-r01-billiard-glazing-pilot
          git worktree add --detach /tmp/window-r01-publish origin/window-r01-billiard-glazing-pilot
          cd /tmp/window-r01-publish
          mkdir -p docs/development/workstreams/window-r01/review
          cp -a /tmp/window-r01-evidence/. docs/development/workstreams/window-r01/review/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/workstreams/window-r01/review/
          if ! git diff --cached --quiet; then
            git commit -m "docs(window-r01): capture R02 review screenshots and render metrics"
            git push origin HEAD:window-r01-billiard-glazing-pilot
          fi
