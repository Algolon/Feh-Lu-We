# Temporary one-shot importer used only on the isolated feature branch.
# Its sole purpose is to vendor the user-authorized MP3 as a binary Git blob.
name: Import authorized Bong Rippie audio
on:
  push:
    branches:
      - feature/bong-rippie-real-audio-r06
    paths:
      - .github/workflows/import-bong-rippie.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Download and validate original sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/audio
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            -H "User-Agent: Mozilla/5.0" \
            -H "Referer: https://www.myinstants.com/en/instant/bong-rippie-91413/" \
            "https://www.myinstants.com/media/sounds/bong-rippie.mp3" \
            -o public/audio/bong-rippie.mp3
          type=$(file -b --mime-type public/audio/bong-rippie.mp3)
          bytes=$(wc -c < public/audio/bong-rippie.mp3)
          echo "Downloaded: $type ($bytes bytes)"
          test "$type" = "audio/mpeg"
          test "$bytes" -ge 10000
          test "$bytes" -le 1000000
          sha256sum public/audio/bong-rippie.mp3
      - name: Commit binary asset to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/bong-rippie.mp3
          git commit -m "assets: vendor authorized Bong Rippie MP3"
          git push origin HEAD:feature/bong-rippie-real-audio-r06
