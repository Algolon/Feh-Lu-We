name: PORTAL-R02 threshold visibility QA
on:
  push:
    branches: [fix/portal-r02-cross-room-sightlines]
concurrency:
  group: portal-r02-threshold
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Paired kitchen threshold screenshots and scene visibility checks
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4188 > /tmp/portal-r02-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:4188/Feh-Lu-We/ >/dev/null && break; sleep 1; done
          node scripts/portal-r02-qa.mjs http://127.0.0.1:4188/Feh-Lu-We/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-r02-kitchen-sightlines
          path: portal-r02-qa
          if-no-files-found: warn
