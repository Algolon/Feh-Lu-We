name: WINDOW-R02 production integration review (no deploy)
on:
  push:
    branches: [window-r02-prod-integration]
    paths: ['src/**', 'scripts/window-r02-review.mjs', 'scripts/window-r02-baseline.mjs', '.github/workflows/window-r02-review.yml']
concurrency:
  group: window-r02-prod-integration
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Prepare immutable production baseline source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin f5b27bcebaae42f0789e0694546e14d1a8ab4583
          git worktree add --detach /tmp/window-r02-baseline f5b27bcebaae42f0789e0694546e14d1a8ab4583
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/window-r02-baseline/node_modules
      - name: Compare camera triangle loads against production
        run: WINDOW_R02_BASELINE_ROOT=/tmp/window-r02-baseline node scripts/window-r02-baseline.mjs
      - run: node scripts/window-r02-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-r02-game-review
          path: docs/development/workstreams/window-r02/review
          if-no-files-found: warn
      - name: Save review images on latest branch without disturbing code
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/window-r02-captures
          cp -a docs/development/workstreams/window-r02/review/. /tmp/window-r02-captures/
          git fetch origin window-r02-prod-integration
          git worktree add --detach /tmp/window-r02-publish origin/window-r02-prod-integration
          cd /tmp/window-r02-publish
          mkdir -p docs/development/workstreams/window-r02/review
          cp -a /tmp/window-r02-captures/. docs/development/workstreams/window-r02/review/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/workstreams/window-r02/review/
          if ! git diff --cached --quiet; then
            git commit -m "docs(window-r02): save verified facade gameplay screenshots"
            git push origin HEAD:window-r02-prod-integration
          fi
