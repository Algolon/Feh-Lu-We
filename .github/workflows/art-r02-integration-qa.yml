name: ART-R02 integrated validation (temporary)
on:
  push:
    branches: [fix/flw-paintings-permanent-r02]
  workflow_dispatch:
concurrency:
  group: art-r02-integrated-qa
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4188 > /tmp/art-probe-preview.log 2>&1 &
          for attempt in $(seq 1 40); do
            curl -sf http://127.0.0.1:4188/Feh-Lu-We/ > /dev/null && break
            sleep 1
          done
          ART_PROBE_ASSERT=1 ART_PROBE_INJECT_FIRST=1 ART_PROBE_OUT=art-probe/integrated node scripts/art-painting-regression-probe.mjs http://127.0.0.1:4188/Feh-Lu-We/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-art-r02
          path: art-probe
