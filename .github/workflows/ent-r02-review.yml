name: ENT-R02 isolated entry / gallery WebGL review
on:
  push:
    branches:
      - feature/ent-r02-open-entrance-billiard-gallery
    paths:
      - src/world/**
      - src/interactions/world.ts
      - tests/ent-r02-portal-terminal.test.ts
      - src/content/props3d.ts
      - tests/ent-r02.test.ts
      - tests/dev02.test.ts
      - scripts/ent-r02-review.mjs
      - scripts/ent-r02-profiler.mjs
      - .github/workflows/ent-r02-review.yml
permissions:
  contents: write # review branch only: publish screenshots as ordinary browsable repo files
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/ent-r02.test.ts tests/ent-r02-portal-terminal.test.ts tests/cross-room-window-visibility.test.ts tests/dev02.test.ts tests/indoorPlants.test.ts
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Capture real in-game views and collision/path evidence
        run: ENT_R02_THUMBS=1 node scripts/ent-r02-review.mjs
      - name: Checkout pinned unchanged production baseline
        if: always()
        uses: actions/checkout@v7
        with:
          ref: 1f9563b31cbdd44fdc1fd17c29750d74440ad9d1
          path: ent-r02-production-baseline
          persist-credentials: false
      - name: Compare matched high-quality views with production
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd ent-r02-production-baseline
          npm ci
          npm run build
          cd ..
          ENT_R02_BASELINE=1 ENT_R02_ROOT=ent-r02-production-baseline node scripts/ent-r02-review.mjs
          node - <<'NODE'
          const fs=require('fs');
          const path='docs/development/workstreams/ent-r02/';
          const now=JSON.parse(fs.readFileSync(path+'review/results.json'));
          const base=JSON.parse(fs.readFileSync(path+'baseline/results.json'));
          const by=new Map(base.results.map(x=>[x.name,x]));
          const views=now.results.map(x=>{const b=by.get(x.name);return {name:x.name,calls:{baseline:b.calls,prototype:x.calls,delta:x.calls-b.calls},triangles:{baseline:b.triangles,prototype:x.triangles,delta:x.triangles-b.triangles}};});
          fs.writeFileSync(path+'performance-compare.json',JSON.stringify({views,baselineCommit:'1f9563b31cbdd44fdc1fd17c29750d74440ad9d1',note:'matched high-quality software-WebGL poses; not a mobile hardware FPS measurement'},null,2));
          console.log(JSON.stringify(views));
          NODE
      - name: Publish browseable screenshots to ENT-R02 branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir=docs/development/workstreams/ent-r02/images
          mkdir -p "$dir"
          if compgen -G 'docs/development/workstreams/ent-r02/review/*.jpg' >/dev/null; then
            cp docs/development/workstreams/ent-r02/review/*.jpg "$dir/"
            cp docs/development/workstreams/ent-r02/review/results.json "$dir/" || true
          fi
          if test -f docs/development/workstreams/ent-r02/profiler/render-by-group.json; then
            cp docs/development/workstreams/ent-r02/profiler/render-by-group.json "$dir/"
          fi
          if test -f docs/development/workstreams/ent-r02/performance-compare.json; then
            cp docs/development/workstreams/ent-r02/performance-compare.json "$dir/"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir"
          if ! git diff --cached --quiet; then
            git commit -m "docs(ent-r02): publish actual in-game review screenshots [skip ci]"
            git push origin HEAD:feature/ent-r02-open-entrance-billiard-gallery
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ent-r02-blockout-review
          path: |
            docs/development/workstreams/ent-r02/review
            docs/development/workstreams/ent-r02/baseline
            docs/development/workstreams/ent-r02/performance-compare.json
            docs/development/workstreams/ent-r02/profiler
          if-no-files-found: warn
