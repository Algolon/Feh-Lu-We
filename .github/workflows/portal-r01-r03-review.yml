# Branch-only visual review. Never deploys; generated screenshots stay on this review branch.
name: PORTAL-R01-R03 wooden threshold review

on:
  push:
    branches:
      - fix/portal-r01-r03-wooden-threshold
    paths:
      - src/world/manor.ts
      - .github/workflows/portal-r01-r03-review.yml

permissions:
  contents: write

jobs:
  validate-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Render actual in-game portal and verify both walk directions (software WebGL)
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/flw-threshold-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/Feh-Lu-We/ > /dev/null; then break; fi
            sleep 2
          done
          if command -v google-chrome >/dev/null; then
            export CHROME="$(command -v google-chrome)"
          elif command -v chromium >/dev/null; then
            export CHROME="$(command -v chromium)"
          else
            npx playwright-core install chromium
          fi
          node scripts/portal-r01-review.mjs
          mkdir -p docs/development/workstreams/portal-r01-r03/review
          cp docs/development/workstreams/portal-r01/review/*.jpg docs/development/workstreams/portal-r01-r03/review/
          cp docs/development/workstreams/portal-r01/review/results.json docs/development/workstreams/portal-r01-r03/review/results.json
          # Independent close-range photos; the source screenshot runner itself stays unchanged.
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          let source = readFileSync('scripts/portal-r01-review.mjs', 'utf8');
          const scenes = [
            { name: '06-hall-oak-detail', pose: { x: 93.4, y: 0.15, z: 96.55, yaw: Math.PI / 2, pitch: -0.82 } },
            { name: '07-kitchen-oak-detail', pose: { x: 96.6, y: 0.15, z: 96.55, yaw: -Math.PI / 2, pitch: -0.82 } },
          ];
          const scenesBlock = /const scenes = \[[\s\S]*?\n\];/;
          if (!scenesBlock.test(source)) throw Error('Cannot locate original screenshot scene list');
          source = source.replace(scenesBlock, 'const scenes = ' + JSON.stringify(scenes) + ';');
          source = source.replace("const OUT = 'docs/development/workstreams/portal-r01/review';", "const OUT = 'docs/development/workstreams/portal-r01-r03/detail';");
          source = source.replace("x: 91.5, y: 0.15, z: 96.55, yaw: Math.PI/2, pitch: 0.02", "x: 93.4, y: 0.15, z: 96.55, yaw: Math.PI/2, pitch: -0.82");
          source = source.replace("05-mobile-hall-to-kitchen.jpg", "08-mobile-oak-detail.jpg");
          writeFileSync('scripts/portal-r01-r03-close.mjs', source);
          NODE
          node scripts/portal-r01-r03-close.mjs
          cp docs/development/workstreams/portal-r01-r03/detail/*.jpg docs/development/workstreams/portal-r01-r03/review/
          cp docs/development/workstreams/portal-r01-r03/detail/results.json docs/development/workstreams/portal-r01-r03/review/close-results.json
      - name: Preserve screenshot evidence as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-r01-r03-visual-review
          path: docs/development/workstreams/portal-r01-r03/review/
          if-no-files-found: warn
      - name: Commit screenshots only to feature branch, never production
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/workstreams/portal-r01-r03/review/
          if ! git diff --cached --quiet; then
            git commit -m "test(portal-r01-r03): capture visual review and traversal evidence"
            git push origin HEAD:fix/portal-r01-r03-wooden-threshold
          fi
