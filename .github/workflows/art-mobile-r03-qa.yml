name: ART-MOBILE-R03 mobile diagnostic validation
on:
  push:
    branches: [diagnostics/art-mobile-r03]
  workflow_dispatch:
concurrency:
  group: art-mobile-r03-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: GPU atlas diagnostic/full/compact tests
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4188 >/tmp/art-mobile-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:4188/Feh-Lu-We/ >/dev/null && break; sleep 1; done
          node scripts/art-mobile-qa.mjs http://127.0.0.1:4188/Feh-Lu-We/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: art-mobile-r03-evidence
          path: art-mobile-qa
          if-no-files-found: warn
