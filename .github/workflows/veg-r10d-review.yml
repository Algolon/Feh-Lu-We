name: VEG-R10D planter visual review
on:
  push:
    branches:
      - design/veg-r10d-entrance-planters
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: veg-r10d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Render actual planter gallery and in-game mobile cameras
        run: node scripts/veg-r10d-review.mjs
        env:
          VEG_R10D_PRINT_EVIDENCE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veg-r10d-review
          path: docs/veg-r10d/review/
          if-no-files-found: warn
