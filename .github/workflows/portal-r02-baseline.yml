name: PORTAL-R02 matched production baseline
on:
  push:
    branches: [qa/portal-r02-production-baseline]
concurrency:
  group: portal-r02-baseline
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Two unchanged production camera poses
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4188 >/tmp/portal-baseline-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:4188/Feh-Lu-We/ >/dev/null && break; sleep 1; done
          PORTAL_R02_BASELINE=1 node scripts/portal-r02-baseline-qa.mjs http://127.0.0.1:4188/Feh-Lu-We/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-r02-production-baseline
          path: portal-r02-qa
          if-no-files-found: warn
