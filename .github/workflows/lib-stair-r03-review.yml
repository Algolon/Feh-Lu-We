name: LIB-STAIR-R03 top enclosure and one-board treads QA (no deploy)
on:
  push:
    branches: [lib-stair-r03-closure-single-tread]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/lib-stair-r03-review.mjs'
      - '.github/workflows/lib-stair-r03-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lib-stair-r03-review
  cancel-in-progress: true
jobs:
  stair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Render and test closed top rail, tread materials and path
        run: node scripts/lib-stair-r03-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lib-stair-r03-real-in-game-review
          path: docs/lib-stair-r03/review
          if-no-files-found: warn
      - name: Archive review evidence to this branch only
        if: always()
        shell: bash
        run: |
          if [ ! -d docs/lib-stair-r03/review ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/lib-stair-r03/review
          if ! git diff --cached --quiet; then
            git commit -m "docs(lib-stair-r03): real game screenshots and physical collision validation"
            git push origin HEAD:lib-stair-r03-closure-single-tread
          fi
