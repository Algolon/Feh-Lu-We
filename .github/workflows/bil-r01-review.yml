name: BIL-R01 billiard table relocation review
on:
  push:
    branches: [feature/bil-r01-table-to-upper-gallery]
    paths:
      - src/world/manor.ts
      - src/world/layout.ts
      - tests/bil-r01-gallery-table.test.ts
      - scripts/bil-r01-review.mjs
      - .github/workflows/bil-r01-review.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Render and verify actual mobile gallery
        run: BIL_R01_THUMB=1 node scripts/bil-r01-review.mjs
      - name: Publish in-game reference screenshots
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          dir=docs/development/workstreams/bil-r01/screenshots
          mkdir -p "$dir"
          cp docs/development/workstreams/bil-r01/review/*.jpg "$dir/"
          cp docs/development/workstreams/bil-r01/review/results.json "$dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir"
          if ! git diff --cached --quiet; then
            git commit -m "docs(BIL-R01): real gameplay proof of relocated upstairs table [skip ci]"
            git push origin HEAD:feature/bil-r01-table-to-upper-gallery
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bil-r01-table-qa
          path: docs/development/workstreams/bil-r01/review/
          if-no-files-found: warn
