name: ENT-R02-R4E slim-corner review
on:
  push:
    branches:
      - fix/ent-r02-r4e-slim-corner-returns
    paths:
      - src/world/manor.ts
      - tests/ent-r02-r4.test.ts
      - scripts/ent-r02-r4-review.mjs
      - .github/workflows/ent-r02-r4e-review.yml
permissions:
  contents: read
jobs:
  webgl-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Verify actual mobile WebGL views
        run: ENT_R02_R4_THUMB=1 node scripts/ent-r02-r4-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ent-r02-r4e-proof
          path: docs/development/workstreams/ent-r02/r4-review/
          if-no-files-found: warn
